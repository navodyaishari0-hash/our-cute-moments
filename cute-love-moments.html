<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffd6e7">
<meta name="description" content="A tiny corner of the internet for our cutest moments together 💗">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>">
<title>Our Cute Moments 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  :root{--deep:#d85b89;--ink:#6b4a58}
  html{height:100%}
  body{margin:0;min-height:100%;font-family:'Quicksand','Segoe UI',Arial,sans-serif;color:var(--ink);
    background:linear-gradient(-45deg,#ffd6e7,#ffeef5,#ffcfe0,#fff3ec);
    background-size:400% 400%;animation:bgShift 20s ease infinite;
    display:flex;align-items:center;justify-content:center;padding:28px 16px;overflow-x:hidden}
  @keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

  /* floating hearts in the sky */
  .sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .sky span{position:absolute;bottom:-40px;animation:float linear infinite}
  @keyframes float{to{transform:translateY(-115vh) rotate(30deg);opacity:0}}

  .wrap{width:min(100%,520px);position:relative;z-index:1}
  .card{background:rgba(255,255,255,.74);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1.5px solid rgba(255,255,255,.9);border-radius:32px;padding:30px 26px 26px;text-align:center;
    box-shadow:0 24px 70px rgba(198,93,133,.28);animation:rise .8s cubic-bezier(.22,1,.36,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}

  .eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#c0698a;font-weight:700;margin:0 0 6px}
  .title{font-family:'Dancing Script',Georgia,serif;font-weight:700;font-size:clamp(36px,8.5vw,54px);margin:0;
    background:linear-gradient(135deg,#b8496f,#e77ca2);-webkit-background-clip:text;background-clip:text;color:transparent}
  .title .heart{display:inline-block;background:none;color:#e56f98;animation:beat 1.5s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}25%{transform:scale(1.22)}40%{transform:scale(1)}60%{transform:scale(1.13)}}
  .intro{font-size:15px;font-weight:600;color:#97707f;margin:8px 0 20px}

  .moment{border:2px solid #f3c3d6;border-radius:24px;background:linear-gradient(180deg,#fffafd,#ffeef5);padding:14px;margin-bottom:8px}
  .art{height:230px;border-radius:18px;cursor:pointer;overflow:hidden;
    background:radial-gradient(circle at 50% 18%,#fff 0,#ffe9f1 55%,#ffdce9 100%);
    box-shadow:inset 0 0 30px rgba(231,124,162,.08)}
  .art svg{width:100%;height:100%;display:block}
  .art:active{transform:scale(.99)}
  .caption{font-size:16.5px;font-weight:600;line-height:1.55;margin:14px 6px 6px;color:#795563;min-height:3.2em;
    transition:opacity .18s ease,transform .18s ease}
  .caption.out{opacity:0;transform:translateY(8px)}

  /* svg life */
  .char{animation:bob 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  .char-b{animation-delay:1.9s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .eye{animation:blink 5.2s infinite;transform-box:fill-box;transform-origin:center}
  .panda .eye{animation-delay:1.3s}
  @keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  .beatH{transform-box:fill-box;transform-origin:center;animation:beat 1.5s ease-in-out infinite}
  .spark{transform-box:fill-box;transform-origin:center;animation:twinkle 2.8s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}

  .dots{display:flex;gap:7px;justify-content:center;margin:10px 0 2px}
  .dot{width:9px;height:9px;padding:0;border:0;border-radius:99px;background:#f0c3d5;cursor:pointer;
    transition:width .25s,background .25s,transform .2s}
  .dot:hover{transform:scale(1.3)}
  .dot.on{width:26px;background:linear-gradient(135deg,#e77ca2,#ce5c88)}

  .counter{font-size:13px;font-weight:600;color:#a77b8b;margin:8px 0 14px}
  .actions{display:flex;gap:10px;justify-content:center}
  button{border:0;border-radius:999px;padding:13px 26px;background:linear-gradient(135deg,#e77ca2,#ce5c88);
    color:#fff;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:.2px;cursor:pointer;
    box-shadow:0 8px 20px rgba(214,106,150,.35);transition:transform .2s,box-shadow .2s}
  button:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(214,106,150,.45)}
  button:active{transform:scale(.96)}
  .ghost{background:#fff;color:#c95f86;border:2px solid #f3c3d6;box-shadow:0 6px 14px rgba(214,106,150,.18);
    width:52px;height:52px;padding:0;font-size:19px;line-height:1}
  .hint{font-size:12px;font-weight:600;color:#b28b99;margin:18px 0 0}
  .heart{color:#e56f98}

  /* heart burst */
  .pop{position:fixed;z-index:60;pointer-events:none;animation:pop .95s ease-out forwards;will-change:transform,opacity}
  @keyframes pop{from{transform:translate(-50%,-50%) scale(1);opacity:1}
    to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.15);opacity:0}}

  @media(max-width:420px){.card{padding:24px 16px 22px}.art{height:200px}.caption{min-height:4.6em}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>

<main class="wrap">
  <section class="card">
    <p class="eyebrow">A little place for us</p>
    <h1 class="title">Our Cute Moments <span class="heart">♥</span></h1>
    <p class="intro">Little things that make my heart smile 💗</p>

    <div class="moment">
      <div class="art" id="art" aria-label="Cute bear and panda hugging — tap for hearts">
        <svg viewBox="0 0 360 230" role="img">
          <defs><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#b66b83" flood-opacity=".18"/></filter></defs>

          <!-- ground -->
          <path d="M30 194 Q180 216 330 194" fill="none" stroke="#f2b9cd" stroke-width="3"/>
          <g stroke="#8fc7a0" stroke-width="2" stroke-linecap="round" opacity=".8">
            <path d="M52 196 q-2 -8 3 -12"/><path d="M58 197 q2 -7 -2 -11"/>
            <path d="M296 200 q-2 -8 3 -12"/><path d="M302 201 q2 -7 -2 -11"/>
          </g>
          <g fill="#f9c5d8"><circle cx="55" cy="182" r="3.4"/><circle cx="300" cy="186" r="3"/></g>

          <!-- sparkles -->
          <g fill="#f7a8c3">
            <path class="spark" style="animation-delay:.2s" d="M38 52 l1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6 -4.4 -4.4 -1.6 4.4 -1.6Z"/>
            <path class="spark" style="animation-delay:1.1s" d="M318 40 l1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6 -4.4 -4.4 -1.6 4.4 -1.6Z"/>
            <path class="spark" style="animation-delay:1.9s" d="M330 130 l1.4 3.8 3.8 1.4 -3.8 1.4 -1.4 3.8 -1.4 -3.8 -3.8 -1.4 3.8 -1.4Z"/>
            <path class="spark" style="animation-delay:2.5s" d="M28 130 l1.4 3.8 3.8 1.4 -3.8 1.4 -1.4 3.8 -1.4 -3.8 -3.8 -1.4 3.8 -1.4Z"/>
          </g>

          <!-- panda -->
          <g transform="translate(176 48)"><g class="char panda" filter="url(#shadow)">
            <ellipse cx="53" cy="112" rx="52" ry="42" fill="#fff" stroke="#493c42" stroke-width="3"/>
            <circle cx="53" cy="62" r="48" fill="#fff" stroke="#493c42" stroke-width="3"/>
            <circle cx="19" cy="25" r="15" fill="#342d32"/><circle cx="87" cy="25" r="15" fill="#342d32"/>
            <ellipse cx="34" cy="60" rx="11" ry="16" fill="#342d32" transform="rotate(28 34 60)"/>
            <ellipse cx="72" cy="60" rx="11" ry="16" fill="#342d32" transform="rotate(-28 72 60)"/>
            <g class="eye"><circle cx="36" cy="60" r="3" fill="#fff"/><circle cx="70" cy="60" r="3" fill="#fff"/></g>
            <ellipse cx="53" cy="79" rx="6" ry="4" fill="#342d32"/>
            <path d="M47 86 Q53 93 60 86" fill="none" stroke="#342d32" stroke-width="2" stroke-linecap="round"/>
            <ellipse cx="24" cy="74" rx="8" ry="5" fill="#f9b7cd" opacity=".75"/>
            <ellipse cx="82" cy="74" rx="8" ry="5" fill="#f9b7cd" opacity=".75"/>
            <path d="M14 112 Q-3 91 8 80" fill="none" stroke="#342d32" stroke-width="13" stroke-linecap="round"/>
          </g></g>

          <!-- bear hugging -->
          <g transform="translate(72 60)"><g class="char char-b bear" filter="url(#shadow)">
            <ellipse cx="69" cy="112" rx="59" ry="44" fill="#bd805f" stroke="#5a3b32" stroke-width="3"/>
            <circle cx="69" cy="63" r="49" fill="#c88c69" stroke="#5a3b32" stroke-width="3"/>
            <circle cx="35" cy="25" r="15" fill="#c88c69" stroke="#5a3b32" stroke-width="3"/>
            <circle cx="103" cy="25" r="15" fill="#c88c69" stroke="#5a3b32" stroke-width="3"/>
            <circle cx="35" cy="25" r="7" fill="#e7b69a"/><circle cx="103" cy="25" r="7" fill="#e7b69a"/>
            <ellipse cx="69" cy="78" rx="19" ry="13" fill="#e9b99e"/>
            <g class="eye"><circle cx="54" cy="60" r="3" fill="#4d302b"/><circle cx="84" cy="60" r="3" fill="#4d302b"/></g>
            <path d="M64 79 Q69 84 74 79" fill="none" stroke="#68443a" stroke-width="2" stroke-linecap="round"/>
            <ellipse cx="44" cy="70" rx="8" ry="5" fill="#f4a0be" opacity=".7"/>
            <ellipse cx="94" cy="70" rx="8" ry="5" fill="#f4a0be" opacity=".7"/>
            <path d="M111 104 Q143 92 151 69" fill="none" stroke="#5a3b32" stroke-width="13" stroke-linecap="round"/>
          </g></g>

          <!-- beating heart above them -->
          <path class="beatH" d="M178 34 C164 16 138 34 178 58 C218 34 192 16 178 34Z" fill="#ed82a7"/>
        </svg>
      </div>
      <p class="caption" id="caption" aria-live="polite"></p>
    </div>

    <div class="dots" id="dots" aria-label="Choose a moment"></div>
    <p class="counter" id="counter"></p>

    <div class="actions">
      <button class="ghost" id="prev" type="button" aria-label="Previous moment">←</button>
      <button id="next" type="button">Show me more ❤️</button>
      <button class="ghost" id="love" type="button" aria-label="Send a burst of hearts">💖</button>
    </div>

    <p class="hint">Tap the button, press <b>space</b> or swipe — made with love, just for you ✨</p>
  </section>
</main>

<script>
const moments = [
  "Every hug with you feels like coming home 🏡",
  "You make my ordinary days feel magical ✨",
  "Your smile is my favourite notification 💗",
  "Even silence feels special when I'm with you 🌷",
  "You're my favourite person and my safest place 🧸",
  "A little laugh with you can fix a whole day ☀️",
  "I'd choose you in every little moment 💞",
  "The best part of my day is talking to you 💌",
  "You make my world a little softer and brighter 🌸",
  "Here's to a million more cute moments together ❤️"
];

const caption = document.getElementById("caption");
const counter = document.getElementById("counter");
const next    = document.getElementById("next");
const prev    = document.getElementById("prev");
const love    = document.getElementById("love");
let current = 0;

/* ---- floating hearts in the sky ---- */
const sky = document.getElementById("sky");
const glyphs = ["♥","♡","💗","💖","✨"];
const colors = ["#f49ab9","#f7b3c8","#ef8cae","#fbc2d4","#f9d0dd"];
for (let i = 0; i < 16; i++) {
  const s = document.createElement("span");
  s.textContent = glyphs[i % glyphs.length];
  s.style.left = (Math.random() * 100) + "%";
  s.style.fontSize = (13 + Math.random() * 20) + "px";
  s.style.color = colors[i % colors.length];
  s.style.opacity = (0.25 + Math.random() * 0.4).toFixed(2);
  s.style.animationDuration = (9 + Math.random() * 10) + "s";
  s.style.animationDelay = (-Math.random() * 14) + "s";
  sky.appendChild(s);
}

/* ---- progress dots ---- */
const dotsEl = document.getElementById("dots");
const dots = moments.map((_, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "dot";
  b.setAttribute("aria-label", "Moment " + (i + 1));
  b.addEventListener("click", () => go(i));
  dotsEl.appendChild(b);
  return b;
});

/* ---- heart burst ---- */
function burst(n = 14, x, y) {
  const r = x == null ? next.getBoundingClientRect() : { left: x, top: y, width: 0, height: 0 };
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span");
    s.className = "pop";
    s.textContent = glyphs[i % glyphs.length];
    const a = (Math.PI * 2 * i) / n + Math.random() * 0.5;
    const d = 60 + Math.random() * 75;
    s.style.setProperty("--dx", (Math.cos(a) * d) + "px");
    s.style.setProperty("--dy", (Math.sin(a) * d - 45) + "px");
    s.style.left = cx + "px";
    s.style.top = cy + "px";
    s.style.fontSize = (13 + Math.random() * 14) + "px";
    s.style.color = colors[i % colors.length];
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}

/* ---- rendering ---- */
function render(instant) {
  if (instant) {
    caption.textContent = moments[current];
  } else {
    caption.classList.add("out");
    setTimeout(() => {
      caption.textContent = moments[current];
      caption.classList.remove("out");
    }, 180);
  }
  counter.innerHTML = "Moment " + (current + 1) + " of " + moments.length + " <span class='heart'>♥</span>";
  dots.forEach((d, i) => d.classList.toggle("on", i === current));
  next.textContent = current === moments.length - 1 ? "Start again 💗" : "Show me more ❤️";
}
function go(i) {
  current = (i + moments.length) % moments.length;
  render(false);
  burst();
}

next.addEventListener("click", () => go(current + 1));
prev.addEventListener("click", () => go(current - 1));
love.addEventListener("click", () => burst(18));
document.getElementById("art").addEventListener("click", e => burst(10, e.clientX, e.clientY));
document.querySelector(".title .heart").addEventListener("click", e => burst(12, e.clientX, e.clientY));

/* ---- keyboard ---- */
window.addEventListener("keydown", e => {
  if (document.activeElement && document.activeElement.tagName === "BUTTON" && (e.code === "Enter" || e.code === "Space")) return;
  if (e.code === "ArrowRight" || e.code === "Space" || e.code === "Enter") { e.preventDefault(); go(current + 1); }
  if (e.code === "ArrowLeft") { e.preventDefault(); go(current - 1); }
});

/* ---- swipe ---- */
let sx = null;
window.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
window.addEventListener("touchend", e => {
  if (sx == null) return;
  const dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 60) go(current + (dx < 0 ? 1 : -1));
  sx = null;
}, { passive: true });

render(true);
</script>
</body>
</html>
